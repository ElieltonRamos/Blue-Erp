<div class="bg-surface-alt border border-border rounded-lg p-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
    <div>
      <label class="block text-text-secondary text-sm mb-1">Placa</label>
      <input
        type="text"
        placeholder="Ex: ABC-1234"
        class="w-full p-2.5 rounded-lg bg-surface text-text-primary placeholder:text-text-muted border border-border focus:border-accent outline-none uppercase"
        [(ngModel)]="label"
      />
    </div>
    <div>
      <label class="block text-text-secondary text-sm mb-1">Marca</label>
      <input
        type="text"
        placeholder="Ex: Fiat"
        class="w-full p-2.5 rounded-lg bg-surface text-text-primary placeholder:text-text-muted border border-border focus:border-accent outline-none"
        [(ngModel)]="brand"
      />
    </div>
    <div>
      <label class="block text-text-secondary text-sm mb-1">Modelo</label>
      <input
        type="text"
        placeholder="Ex: Uno"
        class="w-full p-2.5 rounded-lg bg-surface text-text-primary placeholder:text-text-muted border border-border focus:border-accent outline-none"
        [(ngModel)]="model"
      />
    </div>
    <div>
      <label class="block text-text-secondary text-sm mb-1">Ano</label>
      <input
        type="text"
        placeholder="Ex: 2015"
        class="w-full p-2.5 rounded-lg bg-surface text-text-primary placeholder:text-text-muted border border-border focus:border-accent outline-none"
        [(ngModel)]="year"
      />
    </div>
    <div>
      <label class="block text-text-secondary text-sm mb-1">Km atual</label>
      <input
        type="text"
        placeholder="Ex: 85000"
        class="w-full p-2.5 rounded-lg bg-surface text-text-primary placeholder:text-text-muted border border-border focus:border-accent outline-none"
        [(ngModel)]="km"
      />
    </div>
  </div>

  <div class="flex justify-end gap-3">
    <button
      (click)="cancel()"
      class="px-4 py-2 rounded-lg border border-border text-text-secondary hover:bg-overlay transition-colors text-sm"
    >
      Cancelar
    </button>
    <button
      (click)="create()"
      [disabled]="creating"
      class="px-4 py-2 bg-accent hover:bg-accent-hover text-btn-text rounded-lg font-medium disabled:opacity-50 text-sm"
    >
      Cadastrar veículo
    </button>
  </div>
</div>
