<!-- purchase-module.html -->
<div
  class="min-h-screen flex flex-col items-center justify-start px-4 py-6"
  [style.background-color]="'var(--color-base)'"
>
  <button
    (click)="goToMenu()"
    class="self-center mb-6 text-white px-6 py-2 rounded shadow-md transition cursor-pointer"
    [style.background-color]="'var(--color-accent)'"
  >
    Voltar para menu
  </button>

  <div
    class="w-full max-w-[90%] rounded-2xl shadow-lg p-6"
    [style.background-color]="'var(--color-surface)'"
  >
    <div
      class="flex items-center justify-between mb-6 border-b pb-4"
      [style.border-color]="'var(--color-border)'"
    >
      <div class="flex flex-wrap gap-4">
        <button
          (click)="changeMenuContext('listPurchases')"
          class="px-4 py-2 rounded-lg flex items-center gap-2 font-semibold transition"
          [style.background-color]="
            menuContext === 'listPurchases' ? 'var(--color-accent)' : 'var(--color-surface-alt)'
          "
          [style.color]="
            menuContext === 'listPurchases' ? 'var(--color-btn-text)' : 'var(--color-text-primary)'
          "
        >
          <i class="fas fa-file-invoice"></i> Compras
        </button>

        <button
          (click)="changeMenuContext('businessPartners')"
          class="px-4 py-2 rounded-lg flex items-center gap-2 font-semibold transition"
          [style.background-color]="
            menuContext === 'businessPartners' ? 'var(--color-accent)' : 'var(--color-surface-alt)'
          "
          [style.color]="
            menuContext === 'businessPartners'
              ? 'var(--color-btn-text)'
              : 'var(--color-text-primary)'
          "
        >
          <i class="fas fa-truck"></i> Fornecedores
        </button>
      </div>
    </div>

    @if (menuContext === 'listPurchases') {
      <app-purchase-list />
    } @else if (menuContext === 'businessPartners') {
      <app-business-partners />
    }
  </div>
</div>
