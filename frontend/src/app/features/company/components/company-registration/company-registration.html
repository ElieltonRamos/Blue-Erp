<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-8">
  <!-- Dados da Empresa -->
  <section>
    <h2 class="text-lg font-semibold mb-4" [style.color]="'var(--color-text-primary)'">
      Dados da Empresa
    </h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          CNPJ <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <input
          type="text"
          formControlName="cnpj"
          placeholder="00.000.000/0000-00"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="hasError('cnpj') ? 'var(--color-danger)' : 'var(--color-border)'"
        />
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Razão Social <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <input
          type="text"
          formControlName="corporateName"
          placeholder="Digite a razão social"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="
            hasError('corporateName') ? 'var(--color-danger)' : 'var(--color-border)'
          "
        />
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Nome Fantasia <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <input
          type="text"
          formControlName="tradeName"
          placeholder="Digite o nome fantasia"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="
            hasError('tradeName') ? 'var(--color-danger)' : 'var(--color-border)'
          "
        />
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Inscrição Estadual <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <input
          type="text"
          formControlName="stateRegistration"
          placeholder="Digite a IE"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="
            hasError('stateRegistration') ? 'var(--color-danger)' : 'var(--color-border)'
          "
        />
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Regime Tributário <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <select
          formControlName="taxRegime"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="'var(--color-border)'"
        >
          <option value="1">Simples Nacional</option>
          <option value="2">Simples Nacional - Excesso</option>
          <option value="3">Regime Normal</option>
        </select>
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Telefone <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <input
          type="text"
          formControlName="phone"
          placeholder="(00) 0000-0000"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="hasError('phone') ? 'var(--color-danger)' : 'var(--color-border)'"
        />
      </div>

      <div class="md:col-span-2 lg:col-span-3">
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          E-mail
        </label>
        <input
          type="email"
          formControlName="email"
          placeholder="contato@empresa.com"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="hasError('email') ? 'var(--color-danger)' : 'var(--color-border)'"
        />
      </div>
    </div>
  </section>

  <!-- Endereço -->
  <section>
    <h2 class="text-lg font-semibold mb-4" [style.color]="'var(--color-text-primary)'">Endereço</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          CEP <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <input
          type="text"
          formControlName="zipCode"
          placeholder="00000-000"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="hasError('zipCode') ? 'var(--color-danger)' : 'var(--color-border)'"
        />
      </div>

      <div class="md:col-span-2">
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Logradouro <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <input
          type="text"
          formControlName="street"
          placeholder="Rua, Avenida, etc."
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="hasError('street') ? 'var(--color-danger)' : 'var(--color-border)'"
        />
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Número <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <input
          type="text"
          formControlName="number"
          placeholder="123"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="hasError('number') ? 'var(--color-danger)' : 'var(--color-border)'"
        />
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Complemento
        </label>
        <input
          type="text"
          formControlName="complement"
          placeholder="Apto, Sala, etc."
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="'var(--color-border)'"
        />
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Bairro <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <input
          type="text"
          formControlName="neighborhood"
          placeholder="Nome do bairro"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="
            hasError('neighborhood') ? 'var(--color-danger)' : 'var(--color-border)'
          "
        />
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Município <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <input
          type="text"
          formControlName="city"
          placeholder="Nome da cidade"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="hasError('city') ? 'var(--color-danger)' : 'var(--color-border)'"
        />
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Código Município (IBGE) <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <input
          type="text"
          formControlName="cityCode"
          placeholder="0000000"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="
            hasError('cityCode') ? 'var(--color-danger)' : 'var(--color-border)'
          "
        />
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          UF <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <select
          formControlName="state"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="hasError('state') ? 'var(--color-danger)' : 'var(--color-border)'"
        >
          <option value="">Selecione</option>
          @for (uf of states; track uf) {
            <option [value]="uf">{{ uf }}</option>
          }
        </select>
      </div>
    </div>
  </section>

  <div class="flex justify-end">
    <button
      type="submit"
      [disabled]="isLoading"
      [class.opacity-50]="isLoading"
      [class.cursor-not-allowed]="isLoading"
      class="px-6 py-3 rounded-lg text-white font-medium transition-all duration-200 shadow-md"
      [style.background-color]="'var(--color-accent)'"
    >
      {{ isLoading ? 'Salvando...' : 'Salvar' }}
    </button>
  </div>
</form>
