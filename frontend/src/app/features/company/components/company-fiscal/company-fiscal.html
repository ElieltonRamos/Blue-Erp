<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-8">
  <!-- NFC-e -->
  <section>
    <h2 class="text-lg font-semibold mb-4" [style.color]="'var(--color-text-primary)'">Configurações NFC-e</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'"> Série NFC-e </label>
        <p
          class="w-full px-4 py-3 rounded-lg border-2"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="'var(--color-border)'"
        >
          {{ nfceSeries }}
        </p>
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'"> Número Atual NFC-e </label>
        <p
          class="w-full px-4 py-3 rounded-lg border-2"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="'var(--color-border)'"
        >
          {{ nfceCurrentNumber }}
        </p>
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Ambiente <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <select
          formControlName="nfceEnvironment"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="'var(--color-border)'"
        >
          <option value="staging">Homologação</option>
          <option value="production">Produção</option>
        </select>
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          CSC (Código de Segurança)
          @if (!nfceCscConfigured) {
            <span [style.color]="'var(--color-danger)'">*</span>
          }
        </label>
        <input
          type="text"
          formControlName="nfceCsc"
          [placeholder]="nfceCscConfigured ? SENSITIVE_PLACEHOLDER : 'Digite o CSC'"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="hasError('nfceCsc') ? 'var(--color-danger)' : 'var(--color-border)'"
        />
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          ID CSC
          @if (!nfceCscIdConfigured) {
            <span [style.color]="'var(--color-danger)'">*</span>
          }
        </label>
        <input
          type="text"
          formControlName="nfceCscId"
          [placeholder]="nfceCscIdConfigured ? SENSITIVE_PLACEHOLDER : 'Digite o ID do CSC'"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="hasError('nfceCscId') ? 'var(--color-danger)' : 'var(--color-border)'"
        />
      </div>
    </div>
  </section>

  <!-- NF-e -->
  <section>
    <h2 class="text-lg font-semibold mb-4" [style.color]="'var(--color-text-primary)'">Configurações NF-e</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'"> Série NF-e </label>
        <p
          class="w-full px-4 py-3 rounded-lg border-2"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="'var(--color-border)'"
        >
          {{ nfeSeries }}
        </p>
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'"> Número Atual NF-e </label>
        <p
          class="w-full px-4 py-3 rounded-lg border-2"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="'var(--color-border)'"
        >
          {{ nfeCurrentNumber }}
        </p>
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Ambiente <span [style.color]="'var(--color-danger)'">*</span>
        </label>
        <select
          formControlName="nfeEnvironment"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="'var(--color-border)'"
        >
          <option value="staging">Homologação</option>
          <option value="production">Produção</option>
        </select>
      </div>

      <div>
        <label class="block font-medium mb-2 text-sm" [style.color]="'var(--color-text-secondary)'">
          Crédito Simples Nacional (%)
        </label>
        <input
          type="number"
          step="0.01"
          min="0"
          max="100"
          formControlName="simplesCreditRate"
          placeholder="0,00"
          class="w-full px-4 py-3 rounded-lg border-2 outline-none transition-all duration-200"
          [style.background-color]="'var(--color-surface-alt)'"
          [style.color]="'var(--color-text-primary)'"
          [style.border-color]="hasError('simplesCreditRate') ? 'var(--color-danger)' : 'var(--color-border)'"
        />
      </div>
    </div>
  </section>

  <div class="flex justify-end">
    <button
      type="submit"
      [disabled]="isLoading"
      [class.opacity-50]="isLoading"
      [class.cursor-not-allowed]="isLoading"
      class="px-6 py-3 rounded-lg text-white font-medium transition-all duration-200 shadow-md"
      [style.background-color]="'var(--color-accent)'"
    >
      {{ isLoading ? 'Salvando...' : 'Salvar' }}
    </button>
  </div>
</form>
