<div
  class="min-h-screen flex flex-col items-center justify-start px-4 py-6"
  [style.background-color]="'var(--color-base)'"
>
  <button
    type="button"
    (click)="goToMenu()"
    class="self-center mb-6 text-white px-6 py-2 rounded shadow-md transition cursor-pointer"
    [style.background-color]="'var(--color-accent)'"
  >
    Voltar para menu
  </button>

  <div
    class="w-full max-w-[90%] rounded-2xl shadow-lg p-6"
    [style.background-color]="'var(--color-surface)'"
  >
    <div
      class="flex flex-wrap gap-4 mb-6 border-b pb-4"
      [style.border-color]="'var(--color-border)'"
    >
      @for (tab of tabs; track tab.id) {
        <button
          type="button"
          (click)="changeTab(tab)"
          [class.opacity-50]="isDisabled(tab)"
          [class.cursor-not-allowed]="isDisabled(tab)"
          [title]="isDisabled(tab) ? 'Disponível apenas no plano Pro' : ''"
          class="px-4 py-2 rounded-lg flex items-center gap-2 font-semibold transition"
          [style.background-color]="
            activeTab() === tab.id ? 'var(--color-accent)' : 'var(--color-surface-alt)'
          "
          [style.color]="
            activeTab() === tab.id ? 'var(--color-btn-text)' : 'var(--color-text-primary)'
          "
        >
          <i class="fas" [class]="tab.icon"></i>
          {{ tab.label }}
          @if (activeTab() === tab.id && isDirty()) {
            <span
              class="w-2 h-2 rounded-full"
              title="Alterações não salvas"
              [style.background-color]="'var(--color-warning)'"
            ></span>
          }
        </button>
      }
    </div>

    @switch (activeTab()) {
      @case ('registration') {
        <app-company-registration (dirtyChange)="onDirtyChange($event)" />
      }
      @case ('fiscal') {
        <app-company-fiscal (dirtyChange)="onDirtyChange($event)" />
      }
      @case ('certificate') {
        <app-company-certificate (dirtyChange)="onDirtyChange($event)" />
      }
      @case ('ibpt') {
        <app-company-ibpt (dirtyChange)="onDirtyChange($event)" />
      }
    }
  </div>
</div>
