<div
  class="fixed inset-0 flex items-center justify-center z-50"
  style="background-color: rgba(0, 0, 0, 0.8)"
>
  <div class="bg-surface rounded-lg shadow-lg w-96">
    <div class="bg-overlay text-text-primary p-4 rounded-t-lg">
      <h2 class="text-lg font-semibold">Editar Item</h2>
    </div>

    <div class="p-4">
      <div class="mb-4">
        <p class="text-text-secondary text-sm font-bold mb-1">Produto</p>
        <p class="w-full px-3 py-2 border border-border rounded bg-surface-alt text-text-primary">
          {{ editedItem.name }}
        </p>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-text-secondary text-sm font-bold mb-1">Valor Unitário</label>
          <input
            class="w-full px-3 py-2 border border-border rounded bg-surface text-text-primary"
            [(ngModel)]="editedItem.price"
            type="number"
            min="0"
          />
        </div>
        <div>
          <label class="block text-text-secondary text-sm font-bold mb-1">Quantidade</label>
          <input
            type="number"
            class="w-full px-3 py-2 border border-border rounded bg-surface text-text-primary"
            [(ngModel)]="editedItem.quantity"
          />
        </div>
      </div>

      <div class="mb-4">
        <p class="text-text-secondary text-sm font-bold mb-1">Valor Total</p>
        <div class="w-full px-3 py-2 border border-border rounded bg-surface-alt text-text-primary">
          {{ calculateTotal() }}
        </div>
      </div>
    </div>

    <div class="flex justify-end p-4 border-t border-border">
      <button
        class="px-4 py-2 bg-overlay hover:bg-surface-alt text-text-primary rounded mr-2"
        (click)="onCancel()"
      >
        Cancelar
      </button>
      <button
        class="px-4 py-2 bg-accent hover:bg-accent-hover text-btn-text rounded"
        (click)="onSave()"
      >
        Salvar Alterações
      </button>
    </div>
  </div>
</div>
